<body>
<header><div class="w top"><div><h1>🛡️ Courtage d'assurance</h1><p>Devis comparatifs, polices, primes, commissions et sinistres · <span id="date"></span></p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="who" style="font-size:13px"></span><button class="back" id="lock" hidden type="button" data-a="lock">🔒 Verrouiller</button><a class="back" href="index.html">← Hub</a></div></div></header>
<main><div class="w" id="app"></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<footer>© LOGISTICA · Assurance · <a href="index.html">Retour au hub</a><br><small>Logiciel développé par <b>Sanix Africa Division Technologies</b> · Contact (WhatsApp) : +225 0779181075 / 0140017751</small></footer>
<script src="passerelle-config.js"></script>
<script src="sync-engine.js"></script>
<script src="marque.js"></script><script src="auth-engine.js"></script>
<script src="shell-engine.js"></script>
<script src="assurance-engine.js"></script>
<script>
const $=s=>document.getElementById(s),A=ANGELS_ASSURANCE,{E,fc,av,kpi,ilya}=ANGELS_SHELL;
$("date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const auj=()=>new Date().toISOString().slice(0,10),S=()=>A.etat(),opts=(o,sel)=>Object.keys(o).map(k=>`<option value="${E(k)}"${k===sel?" selected":""}>${E(o[k])}</option>`).join("");
const as=id=>S().assures.find(x=>x.id===id)||{nom:"?"},co=id=>S().compagnies.find(x=>x.id===id)||{nom:"?"},po=id=>S().polices.find(x=>x.id===id)||{};
const fd=d=>d?String(d).split("-").reverse().join("/"):"—",vide=t=>`<div class="empty">${t}</div>`;
let SH=null;const ST_=()=>SH?SH.ST:{q:{}};
const rech=(k,ph)=>`<div class="f"><label style="flex:1;min-width:200px">Recherche<input data-q="${k}" type="search" placeholder="${ph}" value="${E(ST_().q[k]||"")}"></label></div>`;
const bd=(t,c)=>`<span class="bd ${c||"mu"}">${E(t)}</span>`;
const stP=p=>{const s=A.statutPolice(S(),p);return s==="en_cours"?bd("En cours",""):s==="expiree"?bd("Expirée","wa"):s==="resiliee"?bd("Résiliée","wa"):bd("À venir")};
const joursR=p=>Math.round((Date.parse(p.echeance+"T00:00:00Z")-Date.parse(auj()+"T00:00:00Z"))/864e5);
const brOpts=opts(A.BRANCHES);
/* ---------- Écrans ---------- */
function pil(){const r=A.resume(),R=A.aRenouveler(),h=new Date().getHours(),sal=h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir";
 return`<div class="hello"><h2>${sal} 👋</h2><p class="note">${r.polices_en_cours} police(s) en cours · ${r.a_renouveler} à renouveler · ${r.sinistres_ouverts} sinistre(s) ouvert(s).</p></div>
 <div class="kpis">${kpi("💼",r.commissions_mois,"fc","Commissions émises ce mois")}${kpi("📄",r.primes_mois,"fc","Primes émises ce mois (TTC)")}${kpi("💳",r.encaisse_mois,"fc","Primes encaissées ce mois")}${kpi("⏳",r.a_encaisser,"fc","Primes à encaisser",{er:r.impayes>0})}${kpi("↗️",r.a_reverser,"fc","À reverser aux compagnies")}${kpi("🧾",r.commissions_a_recevoir,"fc","Commissions à recevoir")}</div>
 <div class="two"><div class="pan"><h3 style="margin-top:0">🔄 Renouvellements à traiter</h3>${R.length?`<ul class="det">${R.slice(0,8).map(p=>`<li><span><b>${E(as(p.assure_id).nom)}</b> · ${E(A.BRANCHES[p.branche])} · ${E(co(p.compagnie_id).nom)}<br><span class="note">${E(p.numero)} · échéance ${fd(p.echeance)} (${joursR(p)<0?"dépassée de "+(-joursR(p))+" j":"dans "+joursR(p)+" j"})</span></span><button class="btn sm" data-a="renouv" data-v="${p.id}">Renouveler</button></li>`).join("")}</ul>`:vide("Aucune police à renouveler prochainement.")}</div>
 <div class="pan"><h3 style="margin-top:0">À suivre</h3><ul class="det"><li><span>Sinistres ouverts</span><b class="${r.sinistres_ouverts?"er":""}">${r.sinistres_ouverts}</b></li><li><span>Primes impayées (délai dépassé)</span><b class="${r.impayes?"er":""}">${r.impayes}</b></li><li><span>Polices expirées non renouvelées</span><b class="${r.expirees?"er":""}">${r.expirees}</b></li><li><span>Assurés</span><b>${r.assures}</b></li></ul><p style="margin-top:12px"><button class="btn" data-a="tab" data-v="dev">📝 Nouveau devis</button> <button class="btn g" data-a="tab" data-v="sin">🚨 Sinistres</button></p></div></div>`}
function ass(ST){const q=A.norm(ST.q.ass||""),L=S().assures.filter(a=>!q||A.norm(a.nom).includes(q)||String(a.tel).replace(/\D/g,"").includes(q.replace(/\D/g,"")||"~"));
 return`<div class="pan"><h3 style="margin-top:0">➕ Nouvel assuré</h3><form data-f="ass"><div class="f"><label>Nom / raison sociale<input name="nom" required maxlength="100"></label><label>Téléphone<input name="tel" required inputmode="tel" maxlength="25"></label><label>Type<select name="type"><option value="particulier">Particulier</option><option value="entreprise">Entreprise</option></select></label><label>E-mail<input name="email" type="email" maxlength="100"></label><label>Adresse<input name="adresse" maxlength="160"></label></div><button class="btn" type="submit">Enregistrer</button></form></div>
 ${rech("ass","Nom ou téléphone…")}${L.length?`<div class="grid">${L.map(a=>{const P=S().polices.filter(p=>p.assure_id===a.id);return`<div class="bc"><div class="meta">${av(a.nom,44)}<div><b>${E(a.nom)}</b><br><span class="note">${E(a.tel)} · ${a.type==="entreprise"?"Entreprise":"Particulier"}</span></div></div><div class="note">${P.length} police(s) · ${P.filter(p=>A.statutPolice(S(),p)==="en_cours").length} en cours</div><div class="acts"><a class="btn sm g" href="tel:${E(String(a.tel).replace(/[^\d+]/g,""))}">📞</a><a class="btn sm g" target="_blank" rel="noopener noreferrer" href="https://wa.me/${E(String(a.tel).replace(/\D/g,""))}">💬</a></div></div>`}).join("")}</div>`:vide("Aucun assuré.")}`}
function cmp(){return`<div class="pan"><h3 style="margin-top:0">➕ Nouvelle compagnie partenaire</h3><form data-f="cmp"><div class="f"><label>Compagnie<input name="nom" required maxlength="100"></label><label>Contact<input name="contact" maxlength="80"></label><label>Téléphone<input name="tel" maxlength="25"></label><label>E-mail<input name="email" type="email" maxlength="100"></label><label>Commission par défaut (%)<input name="taux" type="number" min="0" max="40" step="0.5" value="10"></label></div><button class="btn" type="submit">Enregistrer</button></form></div>
 ${S().compagnies.length?`<div class="grid">${S().compagnies.map(c=>{const P=S().polices.filter(p=>p.compagnie_id===c.id);return`<div class="bc"><div class="meta"><b>${E(c.nom)}</b>${bd(c.taux+" %","")}</div><div class="note">${E(c.contact||"—")} · ${E(c.tel||"—")}</div><div class="note">${P.length} police(s) · commissions ${fc(P.reduce((s,p)=>s+A.commPolice(S(),p),0))}</div><div class="acts">${Object.keys(c.taux_branche).map(b=>bd(A.BRANCHES[b].split(" ")[0]+" "+c.taux_branche[b]+" %")).join(" ")}<button class="btn sm g" data-a="tbr" data-v="${c.id}">Taux par branche</button></div></div>`}).join("")}</div>`:vide("Aucune compagnie. Ajoutez vos partenaires pour comparer leurs offres.")}`}
function propF(i){return`<fieldset style="border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:8px 0"><legend class="note">Proposition ${i}</legend><div class="f"><label>Compagnie<select name="c${i}"><option value="">—</option>${S().compagnies.map(c=>`<option value="${c.id}">${E(c.nom)}</option>`).join("")}</select></label><label>Prime nette (F)<input name="pn${i}" type="number" min="0" step="100"></label><label>Accessoires (F)<input name="ac${i}" type="number" min="0" step="100"></label><label>Taxes (F)<input name="tx${i}" type="number" min="0" step="100"></label></div><div class="f"><label style="flex:1">Garanties<input name="ga${i}" maxlength="600"></label><label>Franchise<input name="fr${i}" maxlength="120"></label></div></fieldset>`}
function dev(ST){if(ST.sel)return devDet(ST.sel);const D=S().devis.slice().reverse();
 return`<div class="pan"><h3 style="margin-top:0">📝 Nouveau devis comparatif</h3>${S().assures.length&&S().compagnies.length?`<form data-f="dev"><div class="f"><label>Assuré<select name="assure_id">${S().assures.map(a=>`<option value="${a.id}">${E(a.nom)}</option>`).join("")}</select></label><label>Branche<select name="branche">${brOpts}</select></label><label style="flex:1;min-width:240px">Risque à assurer<input name="risque" required maxlength="300" placeholder="Toyota Yaris AB-123-CI, usage personnel"></label></div>${propF(1)}${propF(2)}${propF(3)}<p class="note">Saisissez les primes telles que la compagnie les fixe (nette, accessoires, taxes) : le logiciel ne calcule aucune taxe d'assurance.</p><button class="btn" type="submit">Créer le devis</button></form>`:`<p class="note">Ajoutez d'abord un assuré et au moins une compagnie.</p>`}</div>
 ${D.length?`<div class="grid">${D.map(q=>`<a class="bc" href="#" data-a="ouvrir" data-v="${q.id}"><div class="meta"><b>${E(as(q.assure_id).nom)}</b>${q.statut==="accepte"?bd("Accepté",""):q.statut==="refuse"?bd("Refusé","wa"):bd("En cours")}</div><div class="note">${E(q.numero)} · ${E(A.BRANCHES[q.branche])} · ${fd(q.date)}</div><div>${q.propositions.length} proposition(s) · meilleure : <b>${fc(A.meilleure(q).ttc)}</b></div></a>`).join("")}</div>`:vide("Aucun devis.")}`}
function devDet(id){const q=S().devis.find(x=>x.id===id),best=A.meilleure(q);
 return`<p><button class="btn g sm" data-a="retour">← Devis</button></p><div class="pan"><h3 style="margin-top:0">${E(q.numero)} — ${E(as(q.assure_id).nom)} ${q.statut==="accepte"?bd("Accepté",""):q.statut==="refuse"?bd("Refusé","wa"):""}</h3><p class="note">${E(A.BRANCHES[q.branche])} · ${E(q.risque)}</p></div>
 <div class="tw"><table><thead><tr><th>Compagnie</th><th class="n">Prime nette</th><th class="n">Accessoires</th><th class="n">Taxes</th><th class="n">TTC</th><th>Garanties / franchise</th><th></th></tr></thead><tbody>${q.propositions.map((p,i)=>`<tr><td><b>${E(co(p.compagnie_id).nom)}</b>${p===best?" "+bd("Moins cher",""):""}</td><td class="n">${fc(p.prime_nette)}</td><td class="n">${fc(p.accessoires)}</td><td class="n">${fc(p.taxes)}</td><td class="n"><b>${fc(p.ttc)}</b></td><td>${E(p.garanties||"—")}${p.franchise?"<br><span class='note'>Franchise : "+E(p.franchise)+"</span>":""}</td><td>${q.statut==="en_cours"?`<button class="btn sm" data-a="emettre" data-v="${q.id}|${i}">Choisir</button>`:""}</td></tr>`).join("")}</tbody></table></div>
 ${q.statut==="en_cours"?`<p><button class="btn sm er" data-a="drefus" data-v="${q.id}">Devis refusé par le client</button></p>`:""}${q.police_id?`<p><a class="btn sm g" href="#" data-a="tab-pol" data-v="${q.police_id}">Voir la police émise</a></p>`:""}`}
function pol(ST){if(ST.sel)return polDet(ST.sel);const q=A.norm(ST.q.pol||""),f=ST.fpol||"",L=S().polices.filter(p=>{const st=A.statutPolice(S(),p);return(!q||A.norm(p.numero).includes(q)||A.norm(as(p.assure_id).nom).includes(q))&&(!f||(f==="renouv"?A.aRenouveler().includes(p):st===f))}).slice().reverse();
 return`${rech("pol","N° de police ou assuré…")}<div class="chips">${[["","Toutes"],["en_cours","En cours"],["renouv","À renouveler"],["expiree","Expirées"],["resiliee","Résiliées"]].map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-a="fpol" data-v="${k}">${l}</button>`).join("")}</div><p class="note">${L.length} police(s) · <button class="btn sm g" data-a="csv" data-v="polices">⬇ Exporter (Excel)</button></p>
 ${L.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Assuré</th><th>Compagnie</th><th>Branche</th><th>Échéance</th><th class="n">TTC</th><th class="n">Commission</th><th>État</th></tr></thead><tbody>${L.map(p=>`<tr><td><a href="#" data-a="ouvrir" data-v="${p.id}">${E(p.numero)}</a></td><td>${E(as(p.assure_id).nom)}</td><td>${E(co(p.compagnie_id).nom)}</td><td>${E(A.BRANCHES[p.branche])}</td><td>${fd(p.echeance)}</td><td class="n">${fc(A.ttcPolice(S(),p))}</td><td class="n">${fc(A.commPolice(S(),p))}</td><td>${stP(p)}</td></tr>`).join("")}</tbody></table></div>`:vide("Aucune police. Émettez-en une depuis un devis, ou directement ci-dessous.")}
 <div class="pan" style="margin-top:14px"><h3 style="margin-top:0">➕ Police sans devis</h3>${S().assures.length&&S().compagnies.length?`<form data-f="pol"><div class="f"><label>Assuré<select name="assure_id">${S().assures.map(a=>`<option value="${a.id}">${E(a.nom)}</option>`).join("")}</select></label><label>Compagnie<select name="compagnie_id">${S().compagnies.map(c=>`<option value="${c.id}">${E(c.nom)}</option>`).join("")}</select></label><label>Branche<select name="branche">${brOpts}</select></label><label>N° de police<input name="numero" required maxlength="40"></label></div><div class="f"><label>Effet<input name="effet" type="date" value="${auj()}" required></label><label>Échéance<input name="echeance" type="date"></label><label>Prime nette<input name="prime_nette" type="number" min="1" required></label><label>Accessoires<input name="accessoires" type="number" min="0"></label><label>Taxes<input name="taxes" type="number" min="0"></label><label>Prime payée à<select name="encaisse_par"><option value="courtier">Le courtier</option><option value="assureur">La compagnie</option></select></label></div><label class="note">Risque<input name="risque" maxlength="300" style="width:100%"></label> <button class="btn" type="submit">Émettre</button></form>`:`<p class="note">Ajoutez d'abord un assuré et une compagnie.</p>`}</div>`}
function polDet(id){const p=po(id),s=S(),enc=A.encPrime(s,p),ttc=A.ttcPolice(s,p),due=A.dueCompagnie(s,p),Sn=s.sinistres.filter(x=>x.police_id===id),Av=s.avenants.filter(x=>x.police_id===id);
 return`<p><button class="btn g sm" data-a="retour">← Polices</button></p><div class="pan"><h3 style="margin-top:0">${E(p.numero)} ${stP(p)}</h3><p class="note">${E(as(p.assure_id).nom)} · ${E(co(p.compagnie_id).nom)} · ${E(A.BRANCHES[p.branche])}<br>Du ${fd(p.effet)} au ${fd(p.echeance)} · ${E(p.risque||"")}</p>
 <ul class="det"><li><span>Prime nette</span><b>${fc(p.prime_nette)}</b></li><li><span>Accessoires + taxes (fixés par la compagnie)</span><b>${fc(p.accessoires+p.taxes)}</b></li><li><span>Prime TTC${Av.length?" (avenants inclus)":""}</span><b>${fc(ttc)}</b></li><li><span>Commission (${p.taux} %)</span><b>${fc(A.commPolice(s,p))}</b></li>
 ${p.encaisse_par==="courtier"?`<li><span>Encaissé par le cabinet</span><b>${fc(enc)}</b></li><li><span>Reste à encaisser</span><b class="${ttc-enc>0?"er":""}">${fc(ttc-enc)}</b></li><li><span>Dû à la compagnie</span><b>${fc(due)}</b></li>`:`<li><span>Prime payée directement à la compagnie</span><b>—</b></li><li><span>Commission reçue</span><b>${fc(A.commRecue(s,p))} / ${fc(A.commPolice(s,p))}</b></li>`}</ul>
 <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${p.encaisse_par==="courtier"?`${ttc-enc>0?`<button class="btn sm" data-a="encp" data-v="${p.id}">Encaisser la prime</button>`:""}${due>0?`<button class="btn sm g" data-a="rev" data-v="${p.id}">Reverser à la compagnie</button>`:""}`:`<button class="btn sm" data-a="crec" data-v="${p.id}">Commission reçue</button>`}
 ${p.statut==="en_cours"?`<button class="btn sm g" data-a="avn" data-v="${p.id}">Avenant</button><button class="btn sm g" data-a="renouv" data-v="${p.id}">Renouveler</button><button class="btn sm er" data-a="resil" data-v="${p.id}">Résilier</button>`:""}</div></div>
 ${Av.length?`<div class="pan"><h3 style="margin-top:0">Avenants</h3><ul class="det">${Av.map(a=>`<li><span>${fd(a.date)} · ${E(a.objet)}</span><b>${a.delta>=0?"+":""}${fc(a.delta)}</b></li>`).join("")}</ul></div>`:""}
 <div class="pan"><h3 style="margin-top:0">🚨 Déclarer un sinistre</h3><form data-f="sin"><input type="hidden" name="police_id" value="${p.id}"><div class="f"><label>Date<input name="date" type="date" max="${auj()}" value="${auj()}" required></label><label>Lieu<input name="lieu" maxlength="160"></label><label style="flex:1">Nature du sinistre<input name="nature" required maxlength="300"></label><label>Montant estimé (F)<input name="estime" type="number" min="0"></label></div><button class="btn" type="submit">Déclarer</button></form>${Sn.length?`<ul class="det" style="margin-top:10px">${Sn.map(x=>`<li><span>${E(x.numero)} · ${fd(x.date)} · ${E(x.nature)}</span>${bd(A.ETAPES_SIN[x.statut],x.statut==="refuse"?"wa":"")}</li>`).join("")}</ul>`:""}</div>`}
function sin(ST){const L=S().sinistres.slice().reverse(),o=["declare","transmis","expertise","accepte"];
 return`<p class="note">${L.filter(x=>o.includes(x.statut)).length} sinistre(s) ouvert(s). Déclarez un sinistre depuis la fiche de la police.</p>${L.length?`<div class="grid">${L.map(x=>{const p=po(x.police_id);return`<div class="bc"><div class="meta"><b>${E(x.numero)}</b>${bd(A.ETAPES_SIN[x.statut],x.statut==="refuse"?"wa":"")}</div><div class="note">${E(as(p.assure_id).nom)} · ${E(p.numero||"")} · ${fd(x.date)}</div><div>${E(x.nature)}</div>${x.estime?`<div class="note">Estimé ${fc(x.estime)}${x.indemnite?" · indemnisé "+fc(x.indemnite):""}</div>`:""}<div class="acts">${(A.SUIVANT[x.statut]||[]).map(n=>`<button class="btn sm ${n==="refuse"||n==="clos"?"g":""}" data-a="sav" data-v="${x.id}|${n}">${E(A.ETAPES_SIN[n])}</button>`).join("")}</div><details><summary class="note">Historique</summary><ul class="det">${x.historique.map(h=>`<li><span>${E(A.ETAPES_SIN[h.statut])}${h.note?" — "+E(h.note):""}</span><span class="note">${ilya(h.t)}</span></li>`).join("")}</ul></details></div>`}).join("")}</div>`:vide("Aucun sinistre déclaré.")}`}
function reg(){const c=A.cfg(),E2=A.ecritures();
 return`<div class="pan"><h3 style="margin-top:0">⚙️ Réglages du cabinet</h3><form data-f="reg"><div class="f"><label>N° d'agrément (CIMA)<input name="agrement" maxlength="80" value="${E(c.agrement)}"></label><label>TVA sur commissions (%)<input name="tva_commission" type="number" min="0" max="30" step="0.5" value="${c.tva_commission}"></label><label>Alerte de renouvellement (jours)<input name="alerte_renouvellement" type="number" min="0" max="180" value="${c.alerte_renouvellement}"></label><label>Délai de paiement de prime (jours)<input name="delai_prime" type="number" min="0" max="180" value="${c.delai_prime}"></label></div><button class="btn" type="submit">Enregistrer</button></form><p class="note">Le régime de TVA applicable à vos commissions est à confirmer avec votre expert-comptable (0 par défaut). Les taxes d'assurance ne sont jamais calculées ici : elles figurent dans la prime fixée par la compagnie.</p></div>
 <div class="pan"><h3 style="margin-top:0">📒 Écritures SYSCOHADA</h3><p class="note">${E2.length} écriture(s), ${A.equilibre(E2)?"toutes équilibrées":"⚠ déséquilibre détecté"}. Prime encaissée : 553 / 571 / 5211 en contrepartie de 4712 (reçue pour le compte de la compagnie) · commission : 4712 / 7061 (+ 4431) · reversement : 4712 / trésorerie · prime payée directement à la compagnie : commission 4111 / 7061.</p><button class="btn g sm" data-a="csv" data-v="ecritures">⬇ Exporter le journal (Excel)</button></div>
 <div class="pan"><h3 style="margin-top:0">Journal d'audit</h3><ul class="det">${S().audit.slice(-12).reverse().map(a=>`<li><span>${E(a.action)} — ${E(a.detail)}</span><span class="note">${E(a.par)} · ${ilya(a.t)}</span></li>`).join("")||"<li>Aucune action.</li>"}</ul></div>`}
function dl(nom,txt){const u=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"})),l=document.createElement("a");l.href=u;l.download=nom;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const mode=(def)=>{const m=prompt("Mode de paiement : "+A.MODES.join(", "),def||"Espèces");if(m==null)return null;const r=m==="Espèces"?"":prompt("Référence de la transaction :")||"";return[m,r]};
/* ---------- Actions ---------- */
SH=ANGELS_SHELL.init({id:"assurance",titre:"Assurance",
 vues:[{id:"pil",nom:"Accueil",ic:"🏠",fn:pil,badge:()=>A.resume().a_renouveler},{id:"ass",nom:"Assurés",ic:"👥",fn:ass},{id:"cmp",nom:"Compagnies",ic:"🏛️",fn:cmp},{id:"dev",nom:"Devis",ic:"📝",fn:dev},{id:"pol",nom:"Polices",ic:"📄",fn:pol},{id:"sin",nom:"Sinistres",ic:"🚨",fn:sin,badge:()=>A.resume().sinistres_ouverts},{id:"reg",nom:"Réglages",ic:"⚙️",fn:reg}],
 action(a,v,b,ST,agir,par){
  if(a==="fpol"){ST.fpol=v;return SH.render()}
  if(a==="tab-pol"){ST.tab="pol";ST.sel=v;return SH.render()}
  if(a==="tbr"){const br=prompt("Branche ("+Object.keys(A.BRANCHES).join(", ")+") :","auto");if(!br)return;const t=prompt("Taux de commission (%) :","10");if(t==null)return;return agir(()=>A.tauxBranche(par(),v,br,t.replace(",",".")),"Taux enregistré.")}
  if(a==="emettre"){const[id,i]=v.split("|"),n=prompt("N° de police donné par la compagnie :");if(!n)return;const ef=prompt("Date d'effet (AAAA-MM-JJ) :",auj());if(!ef)return;const ep=confirm("La prime sera-t-elle payée au CABINET ?\nOK = le cabinet encaisse et reverse ; Annuler = payée directement à la compagnie.")?"courtier":"assureur";return agir(()=>{const p=A.emettreDepuisDevis(par(),id,+i,{numero:n,effet:ef,encaisse_par:ep});ST.tab="pol";ST.sel=p.id;return p},"Police émise.")}
  if(a==="drefus"){const m=prompt("Motif du refus (obligatoire) :")||"";return agir(()=>A.refuserDevis(par(),v,m),"Devis refusé.")}
  if(a==="encp"){const p=po(v),r=A.ttcPolice(S(),p)-A.encPrime(S(),p),m=prompt("Montant encaissé (reste "+r+" F) :",r);if(m==null)return;const x=mode();if(!x)return;return agir(()=>A.encaisserPrime(par(),v,m,x[0],x[1]),"Prime encaissée.")}
  if(a==="rev"){const d=A.dueCompagnie(S(),po(v)),m=prompt("Montant reversé (dû "+d+" F) :",d);if(m==null)return;const x=mode("Virement");if(!x)return;return agir(()=>A.reverserCompagnie(par(),v,m,x[0],x[1]),"Reversement enregistré.")}
  if(a==="crec"){const p=po(v),m=prompt("Commission reçue (F) :",A.commPolice(S(),p));if(m==null)return;const x=mode("Virement");if(!x)return;return agir(()=>A.recevoirCommission(par(),v,m,x[0],x[1]),"Commission enregistrée.")}
  if(a==="avn"){const o=prompt("Objet de l'avenant :");if(!o)return;const dl_=prompt("Variation de la prime TTC (F, négative pour une ristourne) :","0");if(dl_==null)return;return agir(()=>A.avenant(par(),v,{objet:o,delta:dl_.replace(",",".")}),"Avenant enregistré.")}
  if(a==="resil"){const m=prompt("Motif de la résiliation (obligatoire) :")||"";if(!m)return;const d=prompt("Date de résiliation (AAAA-MM-JJ) :",auj());return agir(()=>A.resilier(par(),v,d,m),"Police résiliée.")}
  if(a==="renouv"){const n=prompt("N° de la nouvelle police (donné par la compagnie) :");if(!n)return;return agir(()=>{const p=A.renouveler(par(),v,{numero:n});ST.tab="pol";ST.sel=p.id;return p},"Police renouvelée (vérifiez la prime).")}
  if(a==="sav"){const[id,n]=v.split("|");let note="",ind="";if(n==="refuse"||n==="clos")note=prompt("Motif (obligatoire) :")||"";else{note=prompt("Note (facultatif) :")||"";if(n==="indemnise")ind=prompt("Indemnité versée (F) :")||""}return agir(()=>A.avancerSinistre(par(),id,n,note,ind),"Sinistre mis à jour.")}
  if(a==="csv")return dl(v==="polices"?"polices.csv":"journal-assurance.csv",v==="polices"?A.exportPolices():A.csvEcritures());
 },
 changer(){},
 formulaire(k,d,f,ST,agir,par){
  if(k==="ass")return agir(()=>A.ajouterAssure(par(),Object.fromEntries(d)),"Assuré enregistré.");
  if(k==="cmp")return agir(()=>A.ajouterCompagnie(par(),Object.fromEntries(d)),"Compagnie enregistrée.");
  if(k==="dev"){const P=[1,2,3].filter(i=>d.get("c"+i)).map(i=>({compagnie_id:d.get("c"+i),prime_nette:d.get("pn"+i),accessoires:d.get("ac"+i),taxes:d.get("tx"+i),garanties:d.get("ga"+i),franchise:d.get("fr"+i)}));return agir(()=>A.creerDevis(par(),{assure_id:d.get("assure_id"),branche:d.get("branche"),risque:d.get("risque"),propositions:P}),"Devis créé.")}
  if(k==="pol")return agir(()=>A.emettrePolice(par(),Object.fromEntries(d)),"Police émise.");
  if(k==="sin")return agir(()=>A.declarerSinistre(par(),Object.fromEntries(d)),"Sinistre déclaré.");
  if(k==="reg")return agir(()=>A.reglages(par(),Object.fromEntries(d)),"Réglages enregistrés.")}});
ANGELS_SYNC.init({app:"assurance",nom:"Assurance",get:()=>A.etat(),persist:()=>A.sauver(),refresh:()=>{if(SH.garde())SH.render()},qui:()=>SH.session()?SH.session().nom:"poste"});
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c8352b">
<script src="signal-engine.js"></script>
<link rel="manifest" href="manifest-livreur.webmanifest">
<link rel="icon" type="image/png" href="icons/livreur-192.png">
<link rel="apple-touch-icon" href="icons/livreur-apple-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Livreur LOGISTICA">
<title>Livreur — LOGISTICA</title>
<style>
:root{--b:#c8352b;--b2:#7a1d17;--bg:#f1f6f8;--card:#fff;--tx:#1b2240;--mu:#6b7390;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#d6e4ea}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.hd{background:var(--b2);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd small{opacity:.75;display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.mc.urg{border-color:var(--er)}
label{display:block;font-weight:600;margin:10px 0 0}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:#fff;margin-top:4px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;background:var(--b);color:#fff;font-weight:700;margin-top:8px;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn.ghost{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.wa{background:var(--wa)}
.btn:disabled{opacity:.5}
.mu{color:var(--mu)}.sm{font-size:13px}
.between{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pill{background:#eef5f8;border-radius:10px;padding:8px 10px;margin-top:8px}
.al{border-radius:10px;padding:10px;margin:10px 0;background:#fff1d6;color:#7a4a00}.al.er{background:#fde5e5;color:var(--er)}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#e3eef3;color:var(--b2)}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov>div{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.hide{display:none!important}
.bg{width:auto!important;margin:0!important;padding:8px 14px!important;font-size:20px;line-height:1}
.pg{font-size:18px;margin:6px 0 2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:8px 0 0}.chk input{width:auto;margin:3px 0 0}
.dr{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}.dr .bk{position:absolute;inset:0;background:rgba(10,20,30,.55)}
.dr nav{position:relative;background:#fff;width:min(86vw,340px);height:100%;padding:16px;overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
.mi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:14px 12px;margin-top:8px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-weight:700;color:var(--b2);cursor:pointer}
.sosb{position:fixed;right:14px;bottom:18px;z-index:40;width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:#c4121f;color:#fff;font-size:22px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer}.sosb small{display:block;font-size:10px;font-weight:700}
.bar{height:8px;background:#d6e4ea;border-radius:4px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:8px;background:var(--b);border-radius:4px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kp>div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.kp b{display:block;font-size:20px}.kp span{font-size:12px;color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--b);background:#fff;color:var(--b);font-weight:700;cursor:pointer}.chip.on{background:var(--b);color:#fff}
.mi.on{background:#e3eef3;border-color:var(--b)}.mi.er{color:var(--er)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--b2);color:#fff;padding:10px 16px;border-radius:99px;z-index:40;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="hide"></div>
<script src="passerelle-config.js"></script>
<script src="marque.js"></script><script src="auth-engine.js"></script>
<script>
/* Application LIVREUR (mode serveur). Le livreur s'identifie avec un compte Supabase : le mot de passe est vérifié par le serveur.
   Il ne reçoit JAMAIS le téléphone du client ni le code de confirmation : il demande l'appel au serveur (pont téléphonique) et saisit le code que le client lui communique. */
"use strict";
const CFG=(()=>{const d=window.LOGISTICA_PASSERELLE||{};try{const o=JSON.parse(localStorage.getItem("logistica_supabase")||"null");if(o&&o.off)return{};if(o&&o.url&&o.key)return{url:o.url,key:o.key}}catch(e){}return d})(),FN=String(CFG.url||"").replace(/\/+$/,"")+"/functions/v1/";
const SB_LIB="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",SB_SRI="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fcfa=n=>(Math.round(+n||0)).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
/* L'identifiant est celui affiché au bureau (« livreur.test.2 ») ; on accepte aussi le nom tel qu'on le dit : majuscules, accents, espaces → points */
const identDe=i=>String(i||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9._-]+/g,".").replace(/\.{2,}/g,".").replace(/^\.|\.$/g,"");
const emailDe=i=>{i=String(i||"").trim();return i.includes("@")?i.toLowerCase():identDe(i)+"@users.logistica-erp.app"};
const STATUTS={affectee:"À accepter",acceptee:"Acceptée",en_cours:"En cours",livree:"Livrée",echouee:"Échec",refusee:"Refusée"};
const ACTIFS=["affectee","acceptee","en_cours"];
let sb=null,user=null,moi=null,missions=[],erreur="",timer=null,watch=null,derPos=0,ouvert=null;
/* ---------- Hors ligne d'abord : missions mémorisées sur le téléphone + file des actions à envoyer ---------- */
const LS={c:"ang_lv_cache",f:"ang_lv_file",r:"ang_lv_rej",p:"ang_lv_posdem",g:"ang_lv_gps",z:"ang_lv_pause",l:"ang_lv_plan",m:"ang_lv_chat",v:"ang_lv_chatvu",n:"ang_lv_push",d:"ang_lv_pushinv"},DUREE_CACHE=48*36e5;
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const cache=()=>{const c=lsGet(LS.c,null);return c&&c.t&&c.uid&&Date.now()-c.t<DUREE_CACHE?c:null};
const file=()=>lsGet(LS.f,[]),rejets=()=>lsGet(LS.r,[]),enFile=ref=>file().filter(f=>f.ref===ref),enLigne=()=>navigator.onLine!==false;
const heureC=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function surcouche(m){const q=enFile(m.livraison_ref);if(!q.length)return m;const c=JSON.parse(JSON.stringify(m));q.forEach(f=>{const t=f.type;if(t==="accepter")c.statut="acceptee";else if(t==="refuser")c.statut="refusee";else if(t==="prise_en_charge"){c.payload.collecte_at=new Date(f.t).toISOString();c.payload.nb_colis=+(f.donnees||{}).nb_colis||c.payload.nb_colis}else if(t==="demarrer")c.statut="en_cours";else if(t==="echec")c.statut="echouee";else if(t==="arrive"){c.payload.contact=Object.assign({},c.payload.contact,{arrive_at:c.payload.contact&&c.payload.contact.arrive_at||new Date(f.t).toISOString()})}else if(t==="rappel_client"){const k=Object.assign({},c.payload.contact);k.statut="attente";k.arrive_at=k.arrive_at||new Date(f.t).toISOString();c.payload.contact=k}else if(t==="confirmer")c.attente=true});return c}
function mettreEnFile(ref,type,donnees){let f=file();if(type==="position")f=f.filter(x=>!(x.ref===ref&&x.type==="position"));else if(type!=="incident"&&f.some(x=>x.ref===ref&&x.type===type))return;
 f.push({id:"a"+Date.now()+Math.random().toString(36).slice(2,6),ref,type,donnees:donnees||{},t:Date.now(),cmd:((missions.find(m=>m.livraison_ref===ref))||{}).commande_ref||ref});lsSet(LS.f,f)}
function toast(m,t){const e=$("#toast");e.textContent=m;e.style.background=t==="err"?"#c62828":"#7a1d17";e.classList.remove("hide");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.add("hide"),3500)}
function loadSb(){return new Promise((ok,ko)=>{if(window.supabase)return ok();const sc=document.createElement("script");sc.src=SB_LIB;sc.integrity=SB_SRI;sc.crossOrigin="anonymous";sc.onload=ok;sc.onerror=()=>ko(new Error("Connexion Internet requise pour se connecter"));document.head.appendChild(sc)})}
async function api(fn,body){let t=null;try{const{data}=await sb.auth.getSession();t=data&&data.session&&data.session.access_token}catch(e){}
 if(!t){const e=new Error("Session expirée : reconnectez-vous");e.status=401;e.reseau=!enLigne();throw e}
 let r;try{r=await fetch(FN+fn,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+t,apikey:CFG.key},body:JSON.stringify(body)})}catch(x){const e=new Error("Réseau indisponible");e.reseau=true;throw e}
 const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false){const e=new Error(j.erreur||("Erreur "+r.status));e.status=r.status;throw e}return j}
const ferme=()=>{try{camStop();clearInterval(PVPOLL)}catch(e){}const o=$(".ov");if(o)o.remove()};
function modal(html){ferme();const o=document.createElement("div");o.className="ov";o.innerHTML="<div>"+html+"</div>";o.addEventListener("click",e=>{if(e.target===o)ferme()});document.body.appendChild(o);return o}

/* ---------- Connexion ---------- */
function vueLogin(msg){$("#app").innerHTML=`<div class="hd"><div><b>LOGISTICA — Livreur</b><small>Connexion sécurisée</small></div></div><div class="wrap"><div class="card"><form id="fl" autocomplete="on"><label>Identifiant<input id="li" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required></label><label>Mot de passe<input id="lp" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" required></label>${msg?`<div class="al er">${esc(msg)}</div>`:""}<button class="btn" type="submit">Se connecter</button></form></div><div class="inst"></div><div class="sm mu">Votre mot de passe est vérifié par le serveur. Les numéros des clients ne sont jamais affichés sur cet appareil.</div><div class="sm mu sanix" style="margin-top:14px;text-align:center">Logiciel développé par <b>Sanix Africa Division Technologies</b> · WhatsApp : +225 0779181075 / 0140017751</div></div>`;
 $("#fl").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button:not(.aa-e)");b.disabled=true;try{await loadSb();sb=sb||window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});const em=emailDe($("#li").value),pw=$("#lp").value;let{error}=await sb.auth.signInWithPassword({email:em,password:pw});
   /* le clavier du téléphone ajoute souvent une espace après le dernier mot : on réessaie sans les espaces de début et de fin */
   if(error&&/invalid login/i.test(error.message)&&pw.trim()&&pw!==pw.trim())({error}=await sb.auth.signInWithPassword({email:em,password:pw.trim()}));
   if(error)throw new Error(/invalid login/i.test(error.message)?"Identifiant ou mot de passe incorrect (identifiant envoyé : "+em.split("@")[0]+")":error.message);await demarrer()}catch(x){vueLogin(x.message);}}}
const mdpValide=m=>m.length>=10&&[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(m)).length>=3;
function vueChangement(){$("#app").innerHTML=`<div class="hd"><div><b>Nouveau mot de passe</b><small>Obligatoire à la première connexion</small></div></div><div class="wrap"><div class="card"><form id="fc"><div class="sm mu">10 caractères minimum, avec au moins 3 types parmi : majuscule, minuscule, chiffre, symbole. Ne reprenez pas votre nom.</div><label>Nouveau mot de passe<input id="n1" type="password" autocomplete="new-password" required></label><label>Confirmer<input id="n2" type="password" autocomplete="new-password" required></label><div id="cm" class="al er hide"></div><button class="btn" type="submit">Enregistrer</button></form></div></div>`;
 $("#fc").onsubmit=async e=>{e.preventDefault();const a=$("#n1").value,b=$("#n2").value,m=$("#cm");const bad=a!==b?"Les deux mots de passe diffèrent":!mdpValide(a)?"Mot de passe trop faible : 10 caractères minimum, 3 types de caractères":(moi&&a.toLowerCase().includes(String(moi.nom||"").toLowerCase().split(/\s+/).filter(x=>x.length>2)[0]||"\u0000"))?"Le mot de passe ne doit pas contenir votre nom":"";
  if(bad){m.textContent=bad;m.classList.remove("hide");return}
  try{const{error}=await sb.auth.updateUser({password:a,data:{chg:false}});if(error)throw error;toast("Mot de passe modifié","ok");await demarrer()}catch(x){m.textContent=x.message;m.classList.remove("hide")}}}

/* ---------- Missions ---------- */
/* Signal sonore à l'arrivée d'une nouvelle mission : le bouton haut-parleur de l'en-tête fait défiler coupé / moyen / fort */
const SIGM={vus:null};
function sigMissions(){const nouv=missions.filter(m=>m.statut==="affectee").map(m=>m.livraison_ref);
 if(SIGM.vus===null){SIGM.vus=new Set(nouv);return}
 const n=nouv.filter(r=>!SIGM.vus.has(r));nouv.forEach(r=>SIGM.vus.add(r));
 if(n.length){(window.__signaux=window.__signaux||[]).push({id:"mission",n:n.length,ok:LOGISTICA_SIGNAL.jouer("alerte",{rep:3,dire:n.length>1?n.length+" nouvelles missions":"Nouvelle mission"})});toast(n.length+" nouvelle(s) mission(s)")}}
try{if(localStorage.getItem("logistica_signal_dev")==null)LOGISTICA_SIGNAL.setDev({voice:false})}catch(e){}   /* lecture vocale des missions : coupée par défaut, activée par le livreur (bouton « voix ») */
const voixIcone=()=>LOGISTICA_SIGNAL.dev().voice?"🗣":"🤐";
const sonIcone=()=>{const d=LOGISTICA_SIGNAL.dev();return d.mute?"🔕":d.vol<=.5?"🔉":"🔊"};
async function charger(){try{const{data,error}=await sb.from("pg_missions").select("livraison_ref,livreur_ref,commande_ref,statut,payload,position,maj_le").order("maj_le",{ascending:false});if(error)throw error;const tout=data||[];missions=recevoir(tout);erreur="";try{sigMissions()}catch(e){}try{sigChat()}catch(e){}lsSet(LS.c,{t:Date.now(),uid:user&&user.id,moi,missions:tout})}catch(x){erreur=enLigne()?x.message:""}
 if(!ouvert&&!(PAGE==="chat"&&document.activeElement&&document.activeElement.id==="chin"))vueMissions()}
const adrTxt=a=>[a.zone,a.quartier].filter(Boolean).map(esc).join(" · ");
const minAtt=t=>t?Math.max(0,Math.floor((Date.now()-Date.parse(t))/60000)):0;
const ctTxt=d=>d?esc((d.libelle||"")+(d.delai?" (dans "+d.delai+" min)":"")+(d.note?" — "+d.note:"")):"";
function ctManque(p){const k=p.contact||{},g=p.inj||{},man=[];if(!g.exiger||k.autorise_echec)return man;
 if(!k.arrive_at)man.push("signalez d'abord votre arrivée (« Je suis arrivé »)");else if(minAtt(k.arrive_at)<(g.attente_min||0))man.push("attendez encore "+((g.attente_min||0)-minAtt(k.arrive_at))+" min sur place");
 if((k.n||0)<(g.tentatives_min||0))man.push("le centre doit d'abord tenter de joindre le client ("+(k.n||0)+"/"+g.tentatives_min+" appel(s))");return man}
function ctBloc(m){const p=m.payload||{},k=p.contact||{},r=esc(m.livraison_ref);
 if(!k.arrive_at)return`<button class="btn" data-a="arrive" data-r="${r}">📍 Je suis arrivé</button>`;
 let h=`<div class="al">📍 Arrivé depuis <b>${minAtt(k.arrive_at)} min</b>${k.n?" · "+k.n+" appel(s) du centre":""}</div>`;
 if(k.statut==="attente")h+=`<div class="al">⏳ <b>Le centre rappelle le client.</b> Patientez sur place.${k.dernier?"<br>Dernier appel : "+ctTxt(k.dernier):""}</div>`;
 else if(k.statut==="joint")h+=`<div class="al" style="background:#e8f7ee">✅ <b>Client joint par le centre :</b> ${ctTxt(k.dernier)}</div>`;
 else if(k.statut==="echec")h+=`<div class="al er">⛔ Le centre vous autorise à déclarer l'échec (client injoignable)${k.autorise_note?" : "+esc(k.autorise_note):""}.</div>`;
 if(k.statut!=="attente"&&k.statut!=="echec")h+=`<button class="btn wa" data-a="norep" data-r="${r}">☎ Le client ne répond pas — prévenir le centre</button>`;
 const man=ctManque(p);if(man.length&&k.statut!=="echec")h+=`<div class="sm mu">Avant un échec « client injoignable » : ${man.map(esc).join(" ; ")}.</div>`;return h}
/* Position du client : jamais bloquante. Connue → itinéraire direct (départ = position actuelle du livreur, mode moto, trafic pris en compte par l'application de cartes) ; inconnue → itinéraire vers la zone et possibilité de la demander au bureau */
const posDem=r=>lsGet(LS.p,{})[r]||0;
const itineraire=(a,g)=>g&&isFinite(+g.lat)&&isFinite(+g.lng)?`https://www.google.com/maps/dir/?api=1&destination=${+g.lat},${+g.lng}&travelmode=two-wheeler&dir_action=navigate`:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent([a.quartier,a.zone,"Abidjan"].filter(Boolean).join(", "))}&travelmode=two-wheeler`;
/* Waze (une seule destination) et temps estimé : distance à vol d'oiseau × 1,4 (détour) à la vitesse moyenne d'une moto en ville */
const waze=(a,g)=>g&&isFinite(+g.lat)&&isFinite(+g.lng)?`https://waze.com/ul?ll=${+g.lat},${+g.lng}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent([a.quartier,a.zone,"Abidjan"].filter(Boolean).join(", "))}&navigate=yes`;
const VMOY=()=>Math.max(10,+REG().vitesse_moy||25);
const etaMin=km=>Math.max(1,Math.round(km*1.4/VMOY()*60));
let DERPOS=null;const posFraiche=()=>DERPOS&&Date.now()-DERPOS.t<10*60000?DERPOS:null;
const etaTxt=g=>{const p=posFraiche();if(!p||!g||!isFinite(+g.lat)||!isFinite(+g.lng))return"";const km=hav(p,{lat:+g.lat,lng:+g.lng}),mn=etaMin(km);return`<div class="sm" style="margin:4px 0 0">⏱ Arrivée estimée : <b>≈ ${mn} min</b> (${km.toFixed(1)} km à vol d'oiseau, arrivée vers ${new Date(Date.now()+mn*60000).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})})</div>`};
function posBloc(m,a,g){const r=esc(m.livraison_ref);
 if(g&&isFinite(+g.lat)&&isFinite(+g.lng))return`<a class="btn" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="${itineraire(a,g)}">🗺 Itinéraire vers la position du client</a><a class="btn ghost" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="${waze(a,g)}">🚗 Ouvrir dans Waze</a>${etaTxt(g)}<div class="sm" style="color:#118a4b;margin:4px 0 0">📍 Position exacte du client enregistrée : Google Maps choisit le meilleur trajet depuis votre position.</div>`;
 const t=posDem(m.livraison_ref),vieux=t&&Date.now()-t>15*60000;
 return`<a class="btn ghost" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="${itineraire(a,null)}">🗺 Itinéraire vers la zone</a><a class="btn ghost" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="${waze(a,null)}">🚗 Ouvrir dans Waze</a>`+
  (t?`<div class="sm" style="color:#b86e00;margin:4px 0 0">📍 Position demandée au bureau à ${new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}. Vous pouvez partir sans attendre : l'itinéraire exact s'affichera ici dès réception.${vieux?` <a href="#" data-a="posclient" data-r="${r}">Redemander</a>`:""}</div>`
  :`<button class="btn ghost" data-a="posclient" data-r="${r}">📍 Demander la position du client</button><div class="sm mu" style="margin:4px 0 0">Facultatif : le bureau envoie un lien au client pour qu'il partage sa position. Vous n'avez pas à attendre pour partir.</div>`)}
/* Code de réception : le client le donne au livreur ; client sans smartphone ou SMS non reçu → le centre l'appelle puis libère le code (jamais visible avant) */
function codeBloc(m){const p=m.payload||{},r=esc(m.livraison_ref);
 if(p.code_libere)return`<div class="sm" style="color:#118a4b;margin:6px 0 0">🔑 Le centre a libéré le code après vérification auprès du client : il est prérempli à la confirmation.</div>`;

/* ---------- Notifications push : missions, messages du centre et alertes même application fermée (navigateur installé ou application Android) ---------- */
const VAPID=()=>String((window.LOGISTICA_PASSERELLE||{}).vapid||"").trim();
const pushOk=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const cleVapid=b=>{const p="=".repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o};
let PUSHST="";   /* "", "actif", "inactif", "refuse", "indispo", "bureau" */
async function pushEtat(){if(!pushOk())return PUSHST="indispo";if(!VAPID())return PUSHST="bureau";if(Notification.permission==="denied")return PUSHST="refuse";
 try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();PUSHST=s&&Notification.permission==="granted"?"actif":"inactif"}catch(e){PUSHST="inactif"}return PUSHST}
async function pushActiver(){if(!pushOk()||!VAPID())return toast("Notifications push non disponibles","err"),false;
 try{const perm=await Notification.requestPermission();if(perm!=="granted"){PUSHST=perm==="denied"?"refuse":"inactif";toast("Notifications refusées : autorisez-les dans les réglages du navigateur","err");return false}
  const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:cleVapid(VAPID())});
  await api("push-abonner",{action:"abonner",subscription:s.toJSON()});lsSet(LS.n,{on:true,t:Date.now()});PUSHST="actif";toast("Notifications activées : vous serez prévenu même application fermée","ok");return true}
 catch(x){toast("Activation impossible : "+(x&&x.message||x),"err");return false}}
async function pushCouper(){try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s){try{await api("push-abonner",{action:"desabonner",endpoint:s.endpoint})}catch(e){}await s.unsubscribe()}}catch(e){}lsSet(LS.n,{on:false,t:Date.now()});PUSHST="inactif";toast("Notifications coupées","ok")}
/* À chaque connexion : si déjà autorisé, on rafraîchit l'abonnement (il peut changer) une fois par jour */
async function pushEntretien(){try{if(!pushOk()||!VAPID()||Notification.permission!=="granted"||!sb)return;const n=lsGet(LS.n,{});if(n.on===false||(n.t&&Date.now()-n.t<864e5))return;const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:cleVapid(VAPID())});await api("push-abonner",{action:"abonner",subscription:s.toJSON()});lsSet(LS.n,{on:true,t:Date.now()})}catch(e){}}
function pushBandeau(){if(PUSHST!=="inactif"||!VAPID()||lsGet(LS.d,0)||Notification.permission==="denied")return"";return`<div class="al" style="background:#e3f2fd;color:#7a1d17">🔔 <b>Activez les notifications</b> pour recevoir vos missions et les messages du centre même application fermée. <a href="#" data-a="pushon">Activer</a> · <a href="#" data-a="pushnon">Plus tard</a></div>`}

/* ---------- Position (uniquement pendant une course en cours) ---------- */
function suivi(){const enCours=missions.find(m=>m.statut==="en_cours");if(!enCours||!navigator.geolocation||!gpsOn()){if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}return}
 if(watch!=null)return;watch=navigator.geolocation.watchPosition(p=>{if((p.coords.accuracy||0)>1000)return;/* position inexploitable (pas de GPS) */try{secuPos(p)}catch(e){}if(Date.now()-derPos<30000)return;const m=missions.find(x=>x.statut==="en_cours");if(!m)return;derPos=Date.now();(enLigne()&&sb?api("mission-action",{livraison_ref:m.livraison_ref,type:"position",donnees:{lat:p.coords.latitude,lng:p.coords.longitude,precision:p.coords.accuracy}}):Promise.reject({reseau:true})).catch(x=>{if(x&&x.reseau)mettreEnFile(m.livraison_ref,"position",{lat:p.coords.latitude,lng:p.coords.longitude,precision:p.coords.accuracy})})},()=>{},{enableHighAccuracy:true,maximumAge:15000})}
function arreter(){clearInterval(timer);timer=null;if(watch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(watch);watch=null}

 if(user.user_metadata&&user.user_metadata.chg){const r=await sb.from("pg_livreurs").select("livreur_ref,nom").maybeSingle();moi=r.data;return vueChangement()}
 const r=await sb.from("pg_livreurs").select("livreur_ref,nom").maybeSingle();moi=r.data;if(!moi){await sb.auth.signOut();user=null;return vueLogin("Compte livreur inactif ou introuvable. Contactez le bureau.")}
 {const c0=lsGet(LS.c,null);if(c0&&c0.uid&&c0.uid!==user.id){[LS.c,LS.f,LS.r].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}})}}
 await vider();await charger();suivi();pushEtat().then(()=>{pushEntretien();if(user&&!ouvert)vueMissions()});clearInterval(timer);timer=setInterval(async()=>{await vider();await charger();suivi()},20000)}

/* Installation sur l'écran d'accueil (Android/Chrome : invite native ; iPhone : consigne Partager > Sur l'écran d'accueil) */
let IPROMPT=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function majInstall(){let h="";
 if(!standalone()&&/^https?:$/.test(location.protocol)){
  if(IPROMPT)h='<button type="button" class="btn ghost" data-a="installer">📲 Installer l\'application Livreur</button>';
  else if(estIOS())h='<div class="al">📲 Pour installer : touchez <b>Partager</b> puis <b>Sur l\'écran d\'accueil</b>.</div>'}
 document.querySelectorAll(".inst").forEach(e=>{e.innerHTML=h;e.style.display=h?"block":"none"})}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();IPROMPT=e;majInstall()});
addEventListener("appinstalled",()=>{IPROMPT=null;majInstall()});
document.addEventListener("click",async e=>{const b=e.target.closest('[data-a="installer"]');if(!b||!IPROMPT)return;IPROMPT.prompt();try{await IPROMPT.userChoice}catch(x){}IPROMPT=null;majInstall()});
new MutationObserver(()=>{if(document.querySelector(".inst:empty"))majInstall()}).observe(document.getElementById("app"),{childList:true});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

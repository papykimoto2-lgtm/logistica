<script>
const $=s=>document.getElementById(s),C=LOGISTICA_CRM,E=C.esc,MQ=window.ERP_MARQUE||{modules:["distribution","transport","agro"]},APPS_UI=C.APPS.filter(a=>(MQ.modules||[]).includes(a[0])),fc=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
$("date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
/* ---------- Accès : un administrateur, la direction ou un responsable commercial de l'une des trois applications ---------- */
const ROLES_OK=["admin","direction","commercial"],DUREE=30*60*1000,SK="logistica_crm_sess";
let SESS=null,TRY={n:0,until:0},ST={tab:"pil",q:"",seg:"",app:"",page:0,sel:null,msg:null,er:false,mq:"",vue:"cartes",focus:null};
try{const s=JSON.parse(sessionStorage.getItem(SK)||"null");if(s&&s.exp>Date.now())SESS=s}catch(e){}
const lire=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
function comptes(){const L=[];C.APPS.forEach(([id,key,nom])=>{const G=lire(key);if(!G)return;(G.users||[]).filter(u=>u.actif!==false&&ROLES_OK.includes(u.role)).forEach(u=>L.push({app:id,appNom:nom,key,id:u.id,nom:u.nom,role:u.role}))});return L}
const par=()=>SESS?SESS.nom+" ("+SESS.appNom+")":"?";
function msg(t,er){ST.msg=t;ST.er=!!er}
function garde(){if(SESS&&SESS.exp<Date.now()){SESS=null;try{sessionStorage.removeItem(SK)}catch(e){}}if(SESS){SESS.exp=Date.now()+DUREE;try{sessionStorage.setItem(SK,JSON.stringify(SESS))}catch(e){}}return !!SESS}
/* ---------- Données ---------- */
let L=[],P=null;
function charger(){L=C.contacts();P=C.pilotage(L)}
const SEGC={vip:"#f5b301",fidele:"#118a4b",nouveau:"#f5a524",actif:"#c8352b",risque:"#f59e0b",dormant:"#94a3b8",prospect:"#8b5cf6",partenaire:"#ec4899"};
const fmt=(v,f)=>v==null||!isFinite(v)?"—":f==="fc"?fc(v):f==="p"?Math.round(v)+" %":Math.round(v).toLocaleString("fr-FR").replace(/[  ]/g," ");
function ilya(d){if(!d)return"—";const j=Math.floor((Date.now()-Date.parse(String(d).slice(0,10)+"T00:00:00Z"))/864e5);if(!isFinite(j))return"—";if(j<=0)return"aujourd'hui";if(j===1)return"hier";if(j<31)return"il y a "+j+" j";if(j<365)return"il y a "+Math.round(j/30)+" mois";return"il y a "+Math.round(j/365)+" an"+(j>=730?"s":"")}
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const ini=n=>String(n).replace(/[^\p{L}\s]/gu,"").trim().split(/\s+/).slice(0,2).map(w=>(w[0]||"").toUpperCase()).join("")||"?";

function tac(){const S=C.etat(),auj=new Date().toISOString().slice(0,10),O=S.taches.filter(t=>!t.fait).sort((a,b)=>(a.echeance||"9")<(b.echeance||"9")?-1:1),F=S.taches.filter(t=>t.fait).slice(-10).reverse(),nm=c=>{const f=L.find(x=>x.cle===c);return f?f.nom:""},due=t=>!t.echeance?`<span class="due">sans échéance</span>`:t.echeance<auj?`<span class="due late">en retard · ${E(t.echeance)}</span>`:t.echeance===auj?`<span class="due today">aujourd'hui</span>`:`<span class="due">${E(t.echeance)}</span>`,ligne=t=>`<div class="tk ${t.fait?"fait":""}"><button class="cb" data-a="tk" data-v="${t.id}" aria-label="${t.fait?"Rouvrir":"Terminer"} : ${E(t.titre)}">${t.fait?"✓":""}</button><div class="t">${E(t.titre)}${t.cle?` <a href="#" data-a="fiche" data-v="${E(t.cle)}" class="note">— ${E(nm(t.cle))}</a>`:""}</div>${t.fait?"":due(t)}</div>`;
 return`<form class="pan" data-f="tache"><div class="addrow"><input name="titre" required minlength="3" maxlength="200" placeholder="➕ Nouvelle tâche (ex. : rappeler le client de Cocody)" aria-label="Titre de la tâche"><input type="date" name="echeance" aria-label="Échéance" style="margin:0"><button class="btn" type="submit">Ajouter</button></div></form>
 <h3>À faire (${O.length})</h3>${O.length?O.map(ligne).join(""):`<div class="pan empty"><span class="big">🌴</span>Rien à faire pour l'instant. Profitez-en !</div>`}
 ${F.length?`<h3>Terminées récemment</h3>${F.map(ligne).join("")}`:""}`}
const MOT={impaye:["Impayé","er"],risque:["À risque","wa"],dormant:["Dormant","wa"],candidat:["Candidat","mu"]};
function rel(){const R=C.relances(L),ex=L.filter(f=>f.stop).length;
 return`<p class="note">Contacts à relancer (impayés, clients à risque ou dormants, candidats en attente). Un contact déjà relancé depuis 14 jours ou opposé à la prospection n'apparaît pas${ex?` (${ex} opposé(s))`:""}. Le message WhatsApp est prêt : ouvrez-le, envoyez-le, puis cliquez « Relancé ».</p>
 ${R.length?R.slice(0,100).map(r=>`<div class="rc">${av(r.f.nom,44)}<div class="m"><div><a href="#" data-a="fiche" data-v="${E(r.f.cle)}"><b>${E(r.f.nom)}</b></a> <span class="bd ${MOT[r.motif][1]}">${MOT[r.motif][0]}</span></div><div class="note">${r.f.encours?fc(r.f.encours)+" d'encours · ":""}Dernier achat : ${E(ilya(r.f.der_achat))}</div><div class="msgp">${E(r.msg)}</div><div class="f" style="margin:6px 0 0"><a class="btn wa sm" href="${E(r.lien)}" target="_blank" rel="noopener noreferrer">💬 Envoyer sur WhatsApp</a><button class="btn sm g" data-a="relance" data-v="${E(r.f.cle)}|${r.motif}">✔ Relancé</button></div></div></div>`).join(""):`<div class="pan empty"><span class="big">🎉</span>Aucune relance à faire. Tout le monde est à jour !</div>`}`}
function qua(){const Q=C.qualite(L),bloc=(t,A,fn)=>`<div class="pan"><h3 style="margin-top:0">${t} (${A.length})</h3>${A.length?`<ul class="det">${A.slice(0,15).map(fn).join("")}</ul>${A.length>15?`<p class="note">… et ${A.length-15} autre(s)</p>`:""}`:`<p class="ok">Rien à signaler.</p>`}</div>`,lk=f=>`<li><a href="#" data-a="fiche" data-v="${E(f.cle)}">${E(f.nom)}</a><span class="note">${E(f.tel||"—")}</span></li>`;
 return`<p class="note">Un même numéro de téléphone réunit automatiquement les fiches d'une même personne dans les trois applications. Voici ce qu'il reste à vérifier.</p><div class="two">${bloc("Contacts sans téléphone exploitable",Q.sans_tel,lk)}${bloc("Même numéro, noms différents",Q.noms_differents,f=>`<li><a href="#" data-a="fiche" data-v="${E(f.cle)}">${E(f.noms.join(" / "))}</a><span class="note">${E(f.tel)}</span></li>`)}${bloc("Même nom, numéros différents (doublons possibles)",Q.meme_nom,g=>`<li><span>${g.map(f=>`<a href="#" data-a="fiche" data-v="${E(f.cle)}">${E(f.nom)}</a> <span class="note">${E(f.tel||"—")}</span>`).join(" · ")}</span></li>`)}${bloc("Présents dans plusieurs applications",Q.multi_apps,f=>`<li><a href="#" data-a="fiche" data-v="${E(f.cle)}">${E(f.nom)}</a><span>${appsBd(f)}</span></li>`)}</div>`}
function reg(){const c=C.cfg(),S=C.etat(),lab={nouveau_j:"« Nouveau » : jours depuis le 1er achat",fidele_n:"« Fidèle » : nombre d'achats minimum",actif_j:"« Actif » : jours maximum depuis le dernier achat",risque_j:"« Dormant » au-delà de (jours)",vip_f:"« VIP » : chiffre d'affaires minimum (F)",impaye_j:"Paiement « en retard » après (jours)"};
 return`<form class="pan" data-f="reg"><h3 style="margin-top:0">Seuils de segmentation</h3><div class="f">${Object.keys(lab).map(k=>`<label>${lab[k]}<input type="number" name="${k}" min="1" step="1" value="${c[k]}" required></label>`).join("")}</div><button class="btn sm" type="submit">Enregistrer</button></form>
 <div class="pan" style="margin-top:12px"><h3 style="margin-top:0">Exports</h3><p class="note">Fichiers CSV (Excel). L'export marketing exclut les contacts opposés à la prospection.</p><button class="btn sm g" data-a="csv" data-v="0">⬇ Tous les contacts</button> <button class="btn sm g" data-a="csv" data-v="1">⬇ Export marketing</button></div>
 <h3>Journal d'audit (50 dernières actions)</h3>${S.audit.length?`<div class="tw"><table><tr><th>Date</th><th>Par</th><th>Action</th><th>Détail</th></tr>${S.audit.slice(-50).reverse().map(a=>`<tr><td>${E(a.t.slice(0,16).replace("T"," "))}</td><td>${E(a.par)}</td><td>${E(a.action)}</td><td style="white-space:normal">${E(a.detail)}</td></tr>`).join("")}</table></div>`:`<p class="note">Aucune action enregistrée.</p>`}`}
const VUES={pil,con,pip,tac,rel,qua,reg};
let LASTV="";
function render(){const ok=garde();$("lock").hidden=!ok;$("gsw").hidden=!ok;$("who").textContent=ok?SESS.nom:"";
 if(!ok){gsClose();$("app").innerHTML=gate();return}
 charger();const fq=document.activeElement&&document.activeElement.id==="q"?document.activeElement.selectionStart:null,cle=ST.tab+":"+(ST.sel||"");
 $("app").innerHTML=tabs()+`<section class="${cle!==LASTV?"vue":""}">`+VUES[ST.tab]()+`</section>`;LASTV=cle;
 if(ST.msg){toast(ST.msg,ST.er);ST.msg=null}
 if(fq!=null){const q=$("q");if(q){q.focus();q.setSelectionRange(fq,fq)}}
 anim();if(ST.focus){const x=$(ST.focus);ST.focus=null;if(x){x.scrollIntoView({behavior:calme()?"auto":"smooth",block:"center"});x.focus()}}}
/* ---------- Actions ---------- */
function agir(fn,ok){try{const r=fn();if(ok)msg(typeof ok==="function"?ok(r):ok)}catch(e){msg(e.message,1)}render()}
document.addEventListener("click",e=>{const lk=e.target.closest("a[href]");if(lk&&!lk.dataset.a)return;const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;if(b.tagName==="A")e.preventDefault();if(a==="lock"){SESS=null;try{sessionStorage.removeItem(SK)}catch(x){}ST.msg=null;return render()}
 if(!garde())return render();
 if(a==="tab"){ST.tab=v;ST.sel=null;ST.page=0;ST.msg=null;if(v==="con"){ST.seg="";ST.app="";ST.q=""}}
 else if(a==="seg"){ST.tab="con";ST.seg=v;ST.page=0;ST.sel=null}
 else if(a==="vue"){ST.vue=v}
 else if(a==="focus"){ST.focus=v}
 else if(a==="fiche"){ST.tab="con";ST.sel=v;gsClose();const g=$("gs");if(g)g.value=""}
 else if(a==="retour"){ST.sel=null}
 else if(a==="pg"){ST.page=Math.max(0,ST.page+(+v))}
 else if(a==="stop")return agir(()=>C.opposer(par(),v,!(L.find(f=>f.cle===v)||{}).stop),"Mis à jour.");
 else if(a==="opp-de"){const f=L.find(x=>x.cle===v);return agir(()=>C.creerOpp(par(),{nom:f.nom,tel:f.tel,cle:f.cle,source:"Fiche CRM"}),"Opportunité créée (onglet Opportunités).")}
 else if(a==="imp-cand")return agir(()=>{const S=C.etat();let n=0;L.filter(f=>f.types.candidat&&!S.opps.some(o=>o.cle===f.cle)).forEach(f=>{C.creerOpp(par(),{nom:f.nom,tel:f.tel,cle:f.cle,source:"Portail"});n++});return n},n=>n+" candidat(s) importé(s).");
 else if(a==="mv"){const[id,et]=v.split("|");return agir(()=>C.deplacerOpp(par(),id,et),"Opportunité déplacée.")}
 else if(a==="perdu"){const m=(document.querySelector(`[data-motif="${v}"]`)||{}).value;return agir(()=>C.deplacerOpp(par(),v,"perdu",m),"Opportunité marquée perdue.")}
 else if(a==="tk")return agir(()=>C.basculerTache(par(),v));
 else if(a==="relance"){const[c,m]=v.split("|");return agir(()=>C.marquerRelance(par(),c,m),"Relance enregistrée.")}
 else if(a==="csv"){const csv=C.exportCsv(L,v==="1"),u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),l=document.createElement("a");l.href=u;l.download="crm-contacts"+(v==="1"?"-marketing":"")+"-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return agir(()=>C.etat(),"Export prêt.")}
 render()});
document.addEventListener("change",e=>{const s=e.target.closest("select[data-a]");if(!s||!garde())return;if(s.dataset.a==="fseg"){ST.seg=s.value;ST.page=0}else if(s.dataset.a==="fapp"){ST.app=s.value;ST.page=0}render()});
document.addEventListener("input",e=>{if(e.target.id==="q"){ST.q=e.target.value;ST.page=0;render()}});
document.addEventListener("submit",e=>{const f=e.target;e.preventDefault();
 if(f.id==="gate"){const d=new FormData(f),c=comptes()[+d.get("u")];if(TRY.until>Date.now()){msg("Trop d'essais : patientez "+Math.ceil((TRY.until-Date.now())/1000)+" s.",1);return render()}
  const G=c&&lire(c.key),u=G&&(G.users||[]).find(x=>x.id===c.id&&x.actif!==false&&ROLES_OK.includes(x.role));
  (async()=>{let r={ok:false};try{if(u)r=await LOGISTICA_AUTH.connecter(u,String(d.get("pwd")))}catch(x){}
   if(r.ok&&r.legacy)msg("Les codes PIN ne sont plus acceptés : connectez-vous une fois à l'application pour créer votre mot de passe.",1);
   else if(r.ok&&u.chg)msg("Votre mot de passe est temporaire : ouvrez l'application et connectez-vous une fois pour le remplacer.",1);
   else if(r.ok){TRY={n:0,until:0};SESS={app:c.app,appNom:c.appNom,id:c.id,nom:c.nom,exp:Date.now()+DUREE};try{sessionStorage.setItem(SK,JSON.stringify(SESS))}catch(x){}ST.msg=null}
   else{TRY.n++;if(TRY.n>=5){TRY.n=0;TRY.until=Date.now()+60000}msg("Compte ou mot de passe incorrect.",1)}
   render()})();return}
 if(!garde())return render();const d=new FormData(f),k=f.dataset.f;
 if(k==="inter")return agir(()=>C.ajouterInteraction(par(),ST.sel,d.get("type"),d.get("texte")),"Échange enregistré.");
 if(k==="tache")return agir(()=>C.ajouterTache(par(),ST.tab==="con"?ST.sel:"",d.get("titre"),d.get("echeance")),"Tâche ajoutée.");
 if(k==="tags")return agir(()=>C.etiqueter(par(),ST.sel,d.get("tags")),"Étiquettes enregistrées.");
 if(k==="opp")return agir(()=>C.creerOpp(par(),{nom:d.get("nom"),tel:d.get("tel"),valeur:d.get("valeur"),source:d.get("source")}),"Opportunité créée.");
 if(k==="reg")return agir(()=>C.reglages(par(),Object.fromEntries(d)),"Seuils enregistrés.")});
/* ---------- Vie de l'interface : notifications, recherche rapide, glisser-déposer, animations ---------- */
let TO=0;
function toast(t,er){const x=$("toast");x.textContent=t;x.className="on"+(er?" er":"");clearTimeout(TO);TO=setTimeout(()=>{x.className=""},er?4200:2600)}
const calme=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function anim(){if(calme())return;document.querySelectorAll("[data-n]").forEach(el=>{const to=+el.dataset.n,f=el.dataset.f,t0=performance.now(),step=t=>{if(!el.isConnected)return;const k=Math.min(1,(t-t0)/450);el.textContent=fmt(k<1?to*(1-Math.pow(1-k,3)):to,f);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function confetti(){if(calme())return;const em=["🎉","✨","🎊","⭐"];for(let i=0;i<26;i++){const s=document.createElement("i");s.className="cf";s.textContent=em[i%4];s.style.left=Math.random()*100+"vw";s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.setProperty("--rot",(Math.random()*720-360)+"deg");s.style.animationDelay=Math.random()*.3+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}
function gsClose(){const r=$("gsr");if(r){r.hidden=true;r.innerHTML=""}}
function gsFind(q){const n=C.norm(q),d=C.chiffres(q);return L.filter(f=>f.nom_n.includes(n)||(d.length>=3&&f.tel_c.includes(d))||f.tags.some(t=>C.norm(t).includes(n))).slice(0,6)}
document.addEventListener("input",e=>{if(e.target.id!=="gs")return;const q=e.target.value.trim();if(q.length<2||!garde())return gsClose();if(!L.length)charger();const R=gsFind(q),r=$("gsr");r.hidden=false;
 r.innerHTML=R.length?R.map(f=>`<button type="button" role="option" data-a="fiche" data-v="${E(f.cle)}">${av(f.nom,34)}<span><b>${E(f.nom)}</b><br><small class="note">${E(f.tel||"Pas de téléphone")} · ${E(C.SEG[f.seg]||"")}</small></span></button>`).join(""):`<button type="button" disabled>Aucun contact trouvé</button>`});
document.addEventListener("keydown",e=>{const t=e.target,typing=t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
 if(((e.key==="k"||e.key==="K")&&(e.ctrlKey||e.metaKey))||(e.key==="/"&&!typing)){if(!SESS)return;e.preventDefault();$("gs").focus();$("gs").select();return}
 if(e.key==="Escape"){gsClose();return}
 if((e.key==="Enter"||e.key===" ")&&t&&t.matches&&t.matches(".cl[data-a]")){e.preventDefault();t.click()}});
document.addEventListener("click",e=>{if(!e.target.closest(".gs"))gsClose()},true);
document.addEventListener("dragstart",e=>{const o=e.target.closest&&e.target.closest(".opp[data-id]");if(!o)return;e.dataTransfer.setData("text/plain",o.dataset.id);e.dataTransfer.effectAllowed="move";o.classList.add("drag")});
document.addEventListener("dragend",()=>{document.querySelectorAll(".opp.drag").forEach(o=>o.classList.remove("drag"));document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest&&e.target.closest(".col[data-et]");if(c){e.preventDefault();c.classList.add("over")}});
document.addEventListener("dragleave",e=>{const c=e.target.closest&&e.target.closest(".col[data-et]");if(c&&!c.contains(e.relatedTarget))c.classList.remove("over")});
function deplacer(id,et){if(!garde())return render();let motif="";if(et==="perdu"){motif=(prompt("Pourquoi cette opportunité est-elle perdue ? (motif obligatoire)")||"").trim();if(!motif){msg("Motif obligatoire pour une opportunité perdue.",1);return render()}}
 agir(()=>C.deplacerOpp(par(),id,et,motif),et==="gagne"?"🎉 Bravo, affaire gagnée !":"Opportunité déplacée.");if(et==="gagne"&&!ST.er)confetti()}
document.addEventListener("drop",e=>{const c=e.target.closest&&e.target.closest(".col[data-et]");if(!c)return;e.preventDefault();const id=e.dataTransfer.getData("text/plain");if(id)deplacer(id,c.dataset.et)});
render();
window.LOGISTICA_CRM_RAFRAICHIR=()=>{if(garde())render()};
LOGISTICA_SYNC.init({app:"crm",nom:"CRM",get:()=>C.etat(),persist:()=>C.sauver(),refresh:()=>{if(SESS&&garde())render()},qui:()=>SESS?SESS.nom:"poste"});
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
